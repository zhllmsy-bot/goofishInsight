services:
  postgres:
    image: postgres:16-alpine
    container_name: goofish-insight-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:4
    container_name: goofish-insight-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ${WEB_IMAGE:-goofish-insight-web:latest}
    container_name: goofish-insight-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command:
      - python
      - -m
      - goofish_insight.cli
      - serve-web
      - --host
      - 0.0.0.0
      - --port
      - "3003"
    ports:
      - "${WEB_PORT:-3003}:3003"
    volumes:
      - .:/app:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
